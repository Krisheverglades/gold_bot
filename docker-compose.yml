services:
  gold-rapid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gold-bot-rapid
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CTRADER_ENV: demo
      PAPER_TRADING: "true"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    working_dir: /app
    command: ["python", "rapid_main.py"]
